<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCOTY — X header</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 1500×500, the X/Twitter header size. Render with branding/render.js */
  :root{--lime:#befd08;--lime2:#d8ff5c}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:500px;background:#000;overflow:hidden}
  .banner{position:relative;width:1500px;height:500px;overflow:hidden;font-family:Poppins,"Inter Display",Inter,sans-serif;color:#fff;
    background:
      radial-gradient(700px 360px at 50% -40%,rgba(190,253,8,.22),transparent 70%),
      radial-gradient(900px 420px at 50% 120%,rgba(70,80,110,.35),transparent 70%),
      #000}
  /* faint dot grid that fades out toward the edges */
  .grid{position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:26px 26px;
    -webkit-mask-image:radial-gradient(60% 75% at 50% 50%,#000 30%,transparent 80%);mask-image:radial-gradient(60% 75% at 50% 50%,#000 30%,transparent 80%)}
  /* pixel spores */
  .px{position:absolute;width:4px;height:4px;background:var(--lime);box-shadow:0 0 10px var(--lime)}
  .px.d{background:#5b7a07;box-shadow:none}
  .px.w{background:#cfd3da;box-shadow:none;width:3px;height:3px}
  /* slime drips hanging from the top edge */
  .drips{position:absolute;top:0;left:0;width:1500px;height:150px}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-top:6px}
  .row{display:flex;align-items:center;gap:30px}
  .logo{width:132px;height:132px;border-radius:30px;overflow:hidden;border:1px solid rgba(255,255,255,.12);
    box-shadow:0 0 0 6px rgba(190,253,8,.06),0 20px 60px rgba(190,253,8,.18)}
  .logo img{width:100%;height:100%;display:block}
  .word{font-size:138px;font-weight:600;letter-spacing:-.05em;line-height:1;
    background:linear-gradient(to bottom,#fff,#fff 45%,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-bottom:6px}
  .tag{font-size:40px;font-weight:500;letter-spacing:-.03em;color:#e5e7eb}
  .tag em{font-style:normal;color:var(--lime);text-shadow:0 0 24px rgba(190,253,8,.55)}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:9px 20px;border-radius:999px;border:1px solid #374151;background:rgba(31,41,55,.55);
    font:500 17px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#9ca3af}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
  /* thin glowing venom line along the bottom */
  .line{position:absolute;left:300px;right:300px;bottom:54px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--lime) 30%,var(--lime2) 50%,var(--lime) 70%,transparent);opacity:.55;filter:drop-shadow(0 0 6px var(--lime))}
</style>
</head>
<body>
<div class="banner" id="banner">
  <div class="grid"></div>

  <svg class="drips" viewBox="0 0 1500 150" aria-hidden="true">
    <defs>
      <linearGradient id="slime" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#d8ff5c"/><stop offset=".55" stop-color="#befd08"/><stop offset="1" stop-color="#8fc200"/>
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g fill="url(#slime)" filter="url(#glow)" opacity=".95">
      <!-- left cluster -->
      <path d="M0 0H330C326 10 318 14 309 14C300 14 298 22 298 40V60C298 70 290 74 285 66C281 60 282 46 282 34C282 24 276 18 266 18C256 18 250 24 250 36V98C250 112 238 116 232 106C228 98 230 76 230 54C230 30 222 22 206 22H170C160 22 156 28 156 38V52C156 62 146 64 142 56C138 48 140 30 130 24C118 18 96 22 70 20C40 18 14 14 0 10Z"/>
      <circle cx="240" cy="128" r="9"/>
      <circle cx="290" cy="84" r="5"/>
      <!-- right cluster -->
      <path d="M1500 0H1150C1156 8 1166 14 1178 14C1190 14 1196 22 1196 36V74C1196 86 1208 90 1214 80C1218 72 1216 56 1216 42C1216 30 1222 24 1232 24C1244 24 1250 32 1250 46V118C1250 134 1264 138 1270 126C1274 116 1272 90 1272 62C1272 40 1280 30 1298 30H1330C1342 30 1346 38 1346 50V60C1346 70 1356 72 1360 64C1364 54 1362 36 1374 28C1388 20 1420 22 1450 20C1474 18 1492 14 1500 10Z"/>
      <circle cx="1260" cy="144" r="8"/>
      <circle cx="1206" cy="98" r="5"/>
      <circle cx="1355" cy="82" r="4"/>
    </g>
  </svg>

  <!-- pixel spores -->
  <span class="px" style="left:118px;top:300px"></span>
  <span class="px d" style="left:212px;top:220px"></span>
  <span class="px w" style="left:380px;top:120px"></span>
  <span class="px" style="left:430px;top:420px"></span>
  <span class="px d" style="left:520px;top:80px"></span>
  <span class="px w" style="left:610px;top:452px"></span>
  <span class="px d" style="left:980px;top:440px"></span>
  <span class="px" style="left:1060px;top:120px"></span>
  <span class="px w" style="left:1120px;top:390px"></span>
  <span class="px d" style="left:1290px;top:250px"></span>
  <span class="px" style="left:1390px;top:340px"></span>
  <span class="px w" style="left:1440px;top:200px"></span>

  <div class="content">
    <div class="row">
      <div class="logo"><img src="../assets/logo.png" alt=""></div>
      <div class="word">SCOTY</div>
    </div>
    <div class="tag">Type it. <em>Launch it.</em></div>
    <div class="pill"><i></i>The one-sentence token launchpad</div>
  </div>

  <div class="line"></div>
</div>
</body>
</html>
