<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCOTY — logo assemble</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0}
  html,body{background:#000;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Time-driven logo reveal: the SCOTY anchor flies in as tiles from every side,
// snaps together in the centre, flashes, and the wordmark settles underneath.
// Size comes from the URL: ?w=1080&h=1080 (default) or ?w=1920&h=1080.
const Q = new URLSearchParams(location.search);
const W = +Q.get("w") || 1080, H = +Q.get("h") || 1080;
const DURATION = 6.5;
const cv = document.getElementById("c");
cv.width = W; cv.height = H; cv.style.width = W + "px"; cv.style.height = H + "px";
const ctx = cv.getContext("2d");

const LIME = "#befd08";
const clamp = (v) => Math.max(0, Math.min(1, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 4);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const hash = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };

const S = Math.min(W, H);
const LOGO = Math.round(S * 0.42);          // final logo size
const CX = W / 2, CY = H / 2 - S * 0.06;     // logo centre (leaves room for the wordmark)
const N = 12;                                // tiles per side
const TS = LOGO / N;
const RADIUS = LOGO * 0.22;                  // rounded corners of the final mark

const img = new Image();
img.src = "logo-hi.png";

// tiles: each flies in from a point beyond the edge, roughly opposite its home
const tiles = [];
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
  const i = r * N + c;
  const hx = CX - LOGO / 2 + (c + 0.5) * TS, hy = CY - LOGO / 2 + (r + 0.5) * TS;
  const ang = Math.atan2(hy - CY, hx - CX) + (hash(i, 1) - 0.5) * 1.6 + (hash(i, 9) < 0.5 ? 0 : Math.PI * (hash(i, 8) - 0.5) * 0.6);
  const dist = Math.hypot(W, H) * (0.62 + hash(i, 2) * 0.35);
  const start = 0.15 + hash(i, 3) * 1.55;      // when it launches
  const dur = 0.85 + hash(i, 4) * 0.55;         // flight time
  tiles.push({ r, c, hx, hy, sx: CX + Math.cos(ang) * dist, sy: CY + Math.sin(ang) * dist,
    rot: (hash(i, 5) - 0.5) * 6, sc: 0.4 + hash(i, 6) * 1.4, start, dur, curve: (hash(i, 7) - 0.5) * 0.9 });
}
const LAST = Math.max(...tiles.map((t) => t.start + t.dur));   // ≈ 2.55s
const SNAP = LAST + 0.05;

// background spores + converging dust
const spores = Array.from({ length: 90 }, (_, i) => ({ x: hash(i, 11) * W, y: hash(i, 12) * H, sp: 8 + hash(i, 13) * 18, ph: hash(i, 14) * 6.28, k: hash(i, 15) }));
const dust = Array.from({ length: 160 }, (_, i) => {
  const a = hash(i, 21) * Math.PI * 2, d = Math.hypot(W, H) * (0.4 + hash(i, 22) * 0.4);
  return { sx: CX + Math.cos(a) * d, sy: CY + Math.sin(a) * d, start: hash(i, 23) * 2.2, dur: 0.9 + hash(i, 24) * 0.8, s: 2 + hash(i, 25) * 3 };
});
const burst = Array.from({ length: 70 }, (_, i) => ({ a: hash(i, 31) * Math.PI * 2, v: S * (0.25 + hash(i, 32) * 0.45), s: 2 + hash(i, 33) * 4 }));

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

window.render = function (t) {
  // background
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const gl = ctx.createRadialGradient(CX, CY, 0, CX, CY, S * 0.75);
  const glowAmt = 0.06 + 0.16 * easeOut(prog(t, SNAP - 0.2, SNAP + 0.6)) - 0.05 * prog(t, SNAP + 0.6, SNAP + 2);
  gl.addColorStop(0, `rgba(190,253,8,${glowAmt})`); gl.addColorStop(1, "rgba(190,253,8,0)");
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  const fl = ctx.createRadialGradient(W / 2, H * 1.2, 0, W / 2, H * 1.2, S * 0.9);
  fl.addColorStop(0, "rgba(70,80,110,.35)"); fl.addColorStop(1, "rgba(70,80,110,0)");
  ctx.fillStyle = fl; ctx.fillRect(0, 0, W, H);

  for (const s of spores) {
    const y = ((s.y - t * s.sp) % H + H) % H, x = s.x + Math.sin(t + s.ph) * 6;
    const a = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(t * 2 + s.ph));
    ctx.fillStyle = s.k < 0.5 ? `rgba(190,253,8,${a})` : s.k < 0.75 ? `rgba(91,122,7,${a})` : `rgba(207,211,218,${a * 0.7})`;
    const z = s.k < 0.5 ? 4 : 3;
    ctx.fillRect(Math.round(x), Math.round(y), z, z);
  }

  // dust streaks converging on the centre
  ctx.globalCompositeOperation = "lighter";
  for (const d of dust) {
    const k = prog(t, d.start, d.start + d.dur);
    if (k <= 0 || k >= 1) continue;
    const e = easeInOut(k), e0 = easeInOut(Math.max(0, k - 0.08));
    const x = d.sx + (CX - d.sx) * e, y = d.sy + (CY - d.sy) * e;
    const x0 = d.sx + (CX - d.sx) * e0, y0 = d.sy + (CY - d.sy) * e0;
    ctx.strokeStyle = `rgba(190,253,8,${0.55 * (1 - k)})`; ctx.lineWidth = d.s;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";

  if (!img.complete || !img.naturalWidth) return;
  const src = img.naturalWidth / N;
  const assembled = t >= SNAP;

  if (!assembled) {
    // flying tiles, with lime motion trails
    for (const p of tiles) {
      const k = prog(t, p.start, p.start + p.dur);
      if (k <= 0) continue;
      const e = easeOut(k);
      const bend = Math.sin(e * Math.PI) * p.curve * LOGO;
      const nx = -(p.hy - p.sy), ny = p.hx - p.sx, nl = Math.hypot(nx, ny) || 1;
      const x = p.sx + (p.hx - p.sx) * e + (nx / nl) * bend;
      const y = p.sy + (p.hy - p.sy) * e + (ny / nl) * bend;
      if (k < 1) {
        const e0 = easeOut(Math.max(0, k - 0.07));
        const bx = p.sx + (p.hx - p.sx) * e0 + (nx / nl) * Math.sin(e0 * Math.PI) * p.curve * LOGO;
        const by = p.sy + (p.hy - p.sy) * e0 + (ny / nl) * Math.sin(e0 * Math.PI) * p.curve * LOGO;
        const gr = ctx.createLinearGradient(bx, by, x, y);
        gr.addColorStop(0, "rgba(190,253,8,0)"); gr.addColorStop(1, `rgba(190,253,8,${0.5 * (1 - k)})`);
        ctx.strokeStyle = gr; ctx.lineWidth = TS * 0.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(x, y); ctx.stroke();
      }
      const rot = p.rot * (1 - e), sc = 1 + (p.sc - 1) * (1 - e);
      ctx.save();
      ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(k * 4);
      ctx.drawImage(img, p.c * src, p.r * src, src, src, -TS / 2 - 0.5, -TS / 2 - 0.5, TS + 1, TS + 1);
      if (k > 0.9) { // a lime edge flash as each tile locks in
        ctx.globalAlpha = (k - 0.9) * 10 * (1 - k) * 10 * 0.25;
        ctx.strokeStyle = LIME; ctx.lineWidth = 2; ctx.strokeRect(-TS / 2, -TS / 2, TS, TS);
      }
      ctx.restore();
    }
  } else {
    // the whole mark, rounded, with a pop
    const k = prog(t, SNAP, SNAP + 0.5);
    const pop = 1 + 0.06 * Math.sin(Math.min(1, k) * Math.PI) ;
    const L = LOGO * pop;
    ctx.save();
    ctx.shadowColor = "rgba(190,253,8,.55)"; ctx.shadowBlur = S * 0.07 * (0.5 + 0.5 * (1 - prog(t, SNAP + 0.4, SNAP + 2.2)));
    roundRect(CX - L / 2, CY - L / 2, L, L, RADIUS * pop);
    ctx.fillStyle = "#111"; ctx.fill();
    ctx.restore();
    ctx.save();
    roundRect(CX - L / 2, CY - L / 2, L, L, RADIUS * pop); ctx.clip();
    ctx.drawImage(img, CX - L / 2, CY - L / 2, L, L);
    // a sheen sweeps across once
    const sw = prog(t, SNAP + 0.15, SNAP + 1.0);
    if (sw > 0 && sw < 1) {
      const sx = CX - L + sw * L * 2;
      const g = ctx.createLinearGradient(sx - L * 0.2, CY - L / 2, sx + L * 0.2, CY + L / 2);
      g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,.28)"); g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g; ctx.fillRect(CX - L / 2, CY - L / 2, L, L);
    }
    ctx.restore();
    ctx.save();
    roundRect(CX - L / 2, CY - L / 2, L, L, RADIUS * pop);
    ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    // flash, shockwave rings, sparks
    const f = 1 - prog(t, SNAP, SNAP + 0.35);
    if (f > 0) { ctx.fillStyle = `rgba(216,255,92,${0.2 * f})`; ctx.fillRect(0, 0, W, H); }
    ctx.globalCompositeOperation = "lighter";
    for (const [delay, max] of [[0, 0.75], [0.12, 1.05]]) {
      const rk = prog(t, SNAP + delay, SNAP + delay + 1.1);
      if (rk > 0 && rk < 1) {
        ctx.strokeStyle = `rgba(190,253,8,${0.7 * (1 - rk)})`; ctx.lineWidth = S * 0.012 * (1 - rk) + 1;
        ctx.beginPath(); ctx.arc(CX, CY, LOGO * 0.55 + easeOut(rk) * S * max * 0.5, 0, Math.PI * 2); ctx.stroke();
      }
    }
    const bk = prog(t, SNAP, SNAP + 1.3);
    if (bk > 0 && bk < 1) for (const b of burst) {
      const d = LOGO * 0.45 + easeOut(bk) * b.v;
      ctx.fillStyle = `rgba(190,253,8,${1 - bk})`;
      ctx.fillRect(CX + Math.cos(b.a) * d, CY + Math.sin(b.a) * d + bk * bk * 40, b.s, b.s);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // wordmark + tagline
  const wk = easeOut(prog(t, SNAP + 0.45, SNAP + 1.2));
  if (wk > 0) {
    const y = CY + LOGO / 2 + S * 0.13;
    ctx.save();
    ctx.globalAlpha = wk;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.font = `600 ${Math.round(S * 0.115)}px Poppins, "Inter Display", sans-serif`;
    const spacing = (1 - wk) * S * 0.03;
    if ("letterSpacing" in ctx) ctx.letterSpacing = (-S * 0.004 + spacing) + "px";
    const g = ctx.createLinearGradient(0, y - S * 0.1, 0, y);
    g.addColorStop(0, "#fff"); g.addColorStop(0.5, "#fff"); g.addColorStop(1, "rgba(255,255,255,.6)");
    ctx.fillStyle = g;
    ctx.fillText("SCOTY", CX, y + (1 - wk) * 16);
    ctx.restore();
  }
  const tk = easeOut(prog(t, SNAP + 0.9, SNAP + 1.6));
  if (tk > 0) {
    const y = CY + LOGO / 2 + S * 0.205;
    ctx.save();
    ctx.globalAlpha = tk;
    ctx.textAlign = "center";
    ctx.font = `500 ${Math.round(S * 0.038)}px Poppins, "Inter Display", sans-serif`;
    const a = "Type it. ", b = "Launch it.";
    const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width, x0 = CX - (wa + wb) / 2;
    ctx.textAlign = "left";
    ctx.fillStyle = "#e5e7eb"; ctx.fillText(a, x0, y + (1 - tk) * 10);
    ctx.shadowColor = "rgba(190,253,8,.6)"; ctx.shadowBlur = 18;
    ctx.fillStyle = LIME; ctx.fillText(b, x0 + wa, y + (1 - tk) * 10);
    ctx.restore();
  }
};
window.DURATION = DURATION;
window.ready = new Promise((r) => { if (img.complete && img.naturalWidth) r(); else img.onload = r; });
</script>
</body>
</html>
