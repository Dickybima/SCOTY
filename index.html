<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore — SCOTY</title>
<meta name="description" content="SCOTY — explore and launch tokens on Pons v2, Robinhood Chain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="explore">
<div id="nav"></div>

<main>
  <div class="wrap">
    <p class="eyebrow">Explore</p>
    <h1 class="title">Fresh launches on <em>Robinhood Chain</em></h1>
    <p class="sub">Every token here started as a single sentence and trades on Pons v2. Find the next one — or <a href="create.html" style="color:var(--accent);font-weight:600">launch your own</a>.</p>

    <div class="stats">
      <div class="stat"><small>Tokens launched</small><b id="sTokens">—</b></div>
      <div class="stat"><small>Total market cap</small><b id="sMcap">—</b></div>
      <div class="stat"><small>Graduated</small><b id="sGrad">—</b></div>
    </div>

    <div class="toolbar">
      <input class="input" id="q" placeholder="Search name or ticker…">
      <div class="tabs" id="sort">
        <button data-s="trending" class="on">Trending</button>
        <button data-s="new">New</button>
        <button data-s="mcap">Market cap</button>
        <button data-s="mine">Mine</button>
      </div>
    </div>

    <div class="tokens" id="tokens"></div>
  </div>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<div id="footer"></div>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/explore.js"></script>
</body>
</html>
